[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/online/htdocs/taxisd.xyz/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=online
numprocs=2
redirect_stderr=true
stdout_logfile=/home/online/htdocs/taxisd.xyz/storage/logs/worker.log
stopwaitsecs=3600


[program:laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /home/online/htdocs/taxisd.xyz/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=online
numprocs=1
redirect_stderr=true
stdout_logfile=/home/online/htdocs/taxisd.xyz/storage/logs/reverb.log